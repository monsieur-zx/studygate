<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>StudyGate Pro</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --card-secondary: #2c2c2e;
            --accent: #0a84ff;
            --warning: #ff9f0a;
            --success: #30d158;
            --danger: #ff453a;
            --purple: #bf5af2;
            --text: #ffffff;
            --text-secondary: #8e8e93;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 20px 16px;
            background-color: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; min-height: 100vh;
            justify-content: center;
        }
        .container { max-width: 440px; margin: 0 auto; width: 100%; }
        .header { text-align: center; margin-bottom: 20px; }
        .lock-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255, 69, 58, 0.15); color: var(--danger);
            padding: 7px 15px; border-radius: 20px; font-weight: 600; font-size: 13px;
            margin-bottom: 10px; transition: all 0.3s ease;
        }
        h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
        .subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 5px; }
        .card {
            background-color: var(--card); border-radius: 22px;
            padding: 22px; box-shadow: 0 12px 34px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .subject-tag {
            display: inline-block; background: rgba(10, 132, 255, 0.18);
            color: var(--accent); font-size: 11px; font-weight: 700;
            text-transform: uppercase; padding: 5px 10px; border-radius: 8px;
            letter-spacing: 0.6px; margin-bottom: 14px;
        }
        .question-text {
            font-size: 17px; font-weight: 600; line-height: 1.45;
            margin: 0 0 18px 0;
        }
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            background-color: var(--card-secondary); color: var(--text);
            border: 1.5px solid transparent; border-radius: 14px;
            padding: 14px 15px; text-align: left; font-size: 15px;
            font-weight: 500; line-height: 1.35; cursor: pointer;
            transition: all 0.18s ease;
        }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.correct {
            background-color: rgba(48, 209, 88, 0.2);
            border-color: var(--success); color: #fff;
        }
        .option-btn.wrong {
            background-color: rgba(255, 69, 58, 0.2);
            border-color: var(--danger); color: #fff;
        }
        .explanation {
            margin-top: 16px; padding: 14px; border-radius: 12px;
            background: rgba(255,255,255,0.05); font-size: 13.5px;
            line-height: 1.45; color: #d1d1d6; display: none;
        }
        .action-area { margin-top: 18px; display: none; flex-direction: column; gap: 10px; }
        .btn {
            width: 100%; font-weight: 700; font-size: 16px;
            padding: 15px; border-radius: 14px; border: none;
            cursor: pointer; text-align: center; text-decoration: none;
            display: block; transition: opacity 0.2s;
        }
        .btn-success { background-color: var(--success); color: #000; }
        .btn-double {
            background: linear-gradient(135deg, #ff9f0a, #ff375f);
            color: #fff; box-shadow: 0 4px 15px rgba(255, 55, 95, 0.35);
        }
        .btn-surrender {
            background-color: rgba(255, 69, 58, 0.15);
            color: var(--danger); border: 1px solid rgba(255, 69, 58, 0.3);
        }
        /* Vista de bloqueo por castigo */
        .lockout-view {
            text-align: center; padding: 20px 10px; display: none;
        }
        .timer-circle {
            font-size: 46px; font-weight: 800; color: var(--danger);
            font-variant-numeric: tabular-nums; margin: 18px 0;
            letter-spacing: 1px;
        }
        .lockout-desc {
            color: var(--text-secondary); font-size: 14px; line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="lock-badge" id="badge">🔒 Entretenimiento Bloqueado</div>
        <h1>StudyGate</h1>
        <div class="subtitle" id="subtitle">1 fallo = 15 min bloqueado o Doble o Nada</div>
    </div>

    <!-- TARJETA DE EXAMEN -->
    <div class="card" id="quizCard">
        <span class="subject-tag" id="subject">Asignatura</span>
        <p class="question-text" id="prompt">Cargando pregunta...</p>
        <div class="options-list" id="options"></div>
        <div class="explanation" id="explanation"></div>
        
        <div class="action-area" id="actionArea"></div>
    </div>

    <!-- TARJETA DE PENALIZACIÓN TEMPORAL -->
    <div class="card lockout-view" id="lockoutCard">
        <div style="font-size: 48px;">⏳</div>
        <h2 style="margin: 10px 0 4px 0; font-size: 22px;" id="lockoutTitle">Castigo Activo</h2>
        <div class="timer-circle" id="timerDisplay">15:00</div>
        <p class="lockout-desc" id="lockoutReason">
            Has fallado la pregunta. No tienes intentos ilimitados: debes esperar a que termine el bloqueo para volver a intentarlo.
        </p>
    </div>
</div>

<script>
const questions = [
    // ================= ANÁLISIS MATEMÁTICO (20 PREGUNTAS) =================
    {
        subject: "Análisis • Normas y Productos Escalares",
        prompt: "Por el Teorema de Jordan-von Neumann, ¿para qué valores de p ∈ [1, ∞] la norma ||·||ₚ en ℝⁿ (n ≥ 2) procede de un producto escalar?",
        options: [
            "Para todo 1 < p < ∞",
            "Única y exclusivamente para p = 2",
            "Para p = 1, p = 2 y p = ∞",
            "Para ningún valor si n > 3"
        ],
        correct: 1,
        explanation: "Una norma procede de un producto escalar si y solo si satisface la identidad del paralelogramo ||x+y||² + ||x-y||² = 2(||x||² + ||y||²). Evaluando en e₁ y e₂ se obtiene 2^(1+2/p) = 4, que solo se cumple para p = 2."
    },
    {
        subject: "Análisis • Geometría de Normas",
        prompt: "¿Por qué la expresión ||x||ₚ = (∑ |xᵢ|ᵖ)^(1/p) deja de ser una norma en ℝⁿ (n ≥ 2) cuando 0 < p < 1?",
        options: [
            "Porque deja de cumplir la homogeneidad ||λx|| = |λ| ||x||",
            "Porque puede tomar valores negativos",
            "Porque viola la desigualdad triangular (las bolas unidad pierden la convexidad)",
            "Porque se anula en vectores distintos del origen"
        ],
        correct: 2,
        explanation: "Para 0 < p < 1 se tiene ||e₁ + e₂||ₚ = 2^(1/p) > 2 = ||e₁||ₚ + ||e₂||ₚ, violando la desigualdad triangular."
    },
    {
        subject: "Análisis • Equivalencia de Normas",
        prompt: "En ℝⁿ, ¿cuáles son las constantes óptimas de equivalencia que relacionan ||x||₂ y ||x||₁ para todo x ∈ ℝⁿ?",
        options: [
            "||x||₁ ≤ ||x||₂ ≤ √n ||x||₁",
            "||x||₂ ≤ ||x||₁ ≤ √n ||x||₂",
            "||x||₂ ≤ ||x||₁ ≤ n ||x||₂",
            "(1/n)||x||₂ ≤ ||x||₁ ≤ ||x||₂"
        ],
        correct: 1,
        explanation: "Elevando al cuadrado se ve que ||x||₂ ≤ ||x||₁, y aplicando Cauchy-Schwarz al vector (|x₁|,...,|xₙ|) con (1,...,1) se obtiene ||x||₁ ≤ √n ||x||₂."
    },
    {
        subject: "Análisis • Operadores Lineales Acotados",
        prompt: "Sea V = C¹([0,1]) con la norma del supremo ||·||_∞ y D: V → C([0,1]) el operador lineal de derivación D(f) = f'. ¿Cuál de las siguientes afirmaciones es cierta?",
        options: [
            "D es acotado con norma ||D|| = 1",
            "D es continuo en f = 0 pero discontinuo en el resto",
            "D no es acotado (y por tanto es discontinuo en todo punto)",
            "Como toda aplicación lineal entre espacios normados es continua, D es continuo"
        ],
        correct: 2,
        explanation: "Tomando fₙ(t) = tⁿ, se tiene ||fₙ||_∞ = 1 pero ||D(fₙ)||_∞ = sup(n tⁿ⁻¹) = n → ∞. En dimensión infinita existen operadores lineales no acotados."
    },
    {
        subject: "Análisis • Teorema de Riesz y Compacidad",
        prompt: "¿Qué ocurre con la bola unidad cerrada B̄(0, 1) en un espacio vectorial normado de dimensión infinita (como ℓ²)?",
        options: [
            "Es compacta por el Teorema de Heine-Borel",
            "Es cerrada y acotada, pero NUNCA es compacta",
            "No es cerrada en la topología métrica",
            "Es secuencialmente compacta pero no por recubrimientos"
        ],
        correct: 1,
        explanation: "El Teorema de Heine-Borel falla en dimensión infinita. Por ejemplo, en ℓ² la sucesión canónica {eₙ} cumple ||eₙ||₂ = 1 pero ||eₙ - eₘ||₂ = √2 para n ≠ m, luego no admite subsucesiones convergentes."
    },
    {
        subject: "Análisis • Límites en Varias Variables",
        prompt: "Sea f(x,y) = (x y²) / (x² + y⁴) para (x,y) ≠ (0,0) y f(0,0) = 0. ¿Qué ocurre con el límite de f cuando (x,y) → (0,0)?",
        options: [
            "Existe y vale 0 porque a lo largo de todas las rectas y = mx e x = 0 el límite es 0",
            "No existe, porque sobre las parábolas x = my² el límite vale m/(m² + 1), que depende de m",
            "Existe y vale 1/2 por acotación con la norma euclídea",
            "Tiende a +∞ sobre la curva y = x²"
        ],
        correct: 1,
        explanation: "Es el contraejemplo clásico: aunque sobre cualquier recta el límite es 0, al aproximarse por x = y² tiende a 1/2 ≠ 0, luego el límite global no existe."
    },
    {
        subject: "Análisis • Límites en Varias Variables",
        prompt: "Considera f(x,y) = (x² y) / (|x|³ + |y|^(3/2)) para (x,y) ≠ (0,0). ¿Existe el límite en el origen?",
        options: [
            "No existe porque al evaluar en y = x² da 1/2",
            "Sí existe y vale 0, pues se acota por (|x|³ + |y|^(3/2))^(1/3) → 0",
            "No existe porque el denominador tiene exponentes fraccionarios",
            "Sí existe y vale 1"
        ],
        correct: 1,
        explanation: "Como x² ≤ (|x|³ + |y|^(3/2))^(2/3) y |y| ≤ (|x|³ + |y|^(3/2))^(2/3), su producto tiene grado equivalente 4/3 > 1 respecto al denominador, por lo que tiende a 0."
    },
    {
        subject: "Análisis • Convergencia Uniforme",
        prompt: "Sea fₙ(x) = xⁿ definida en el intervalo semiabierto X = [0, 1). ¿Cuál es su comportamiento cuando n → ∞?",
        options: [
            "Converge uniformemente a f(x) = 0 porque el límite puntual es continuo en [0, 1)",
            "Converge puntualmente a f(x) = 0, pero NO uniformemente pues sup_{x∈[0,1)} |xⁿ - 0| = 1",
            "No converge puntualmente en [0, 1)",
            "Converge uniformemente en [0, 1) pero no en [0, 1]"
        ],
        correct: 1,
        explanation: "Muestra que el recíproco del teorema de continuidad del límite uniforme es falso: aunque fₙ y el límite f(x) = 0 son continuas en [0,1), la norma infinito ||fₙ - 0||_∞ = 1 no tiende a 0."
    },
    {
        subject: "Análisis • Convergencia Uniforme",
        prompt: "En X = (0, ∞), definimos fₖ(x) = 1/x si 0 < x ≤ k, y fₖ(x) = 0 si x > k. ¿Converge {fₖ} uniformemente a f(x) = 1/x en (0, ∞)?",
        options: [
            "No, porque ni las fₖ ni f son funciones acotadas en (0, ∞)",
            "Sí, porque la diferencia |fₖ(x) - f(x)| sí es acotada y ||fₖ - f||_∞ = 1/k → 0",
            "No, porque en x → 0⁺ el error tiende a infinito",
            "Solo converge uniformemente en compactos [a, b] ⊂ (0, ∞)"
        ],
        correct: 1,
        explanation: "En (0, k] la diferencia fₖ(x) - f(x) es idénticamente 0 (la singularidad en 0 se cancela), y para x > k vale 1/x < 1/k. Luego ||fₖ - f||_∞ = 1/k → 0."
    },
    {
        subject: "Análisis • Derivación e Integración",
        prompt: "Sea fₖ(x) = sin(kx)/√k en ℝ. Cuando k → ∞, ¿qué ocurre con la sucesión y sus derivadas?",
        options: [
            "fₖ → 0 uniformemente en ℝ y f'ₖ → 0 puntualmente",
            "fₖ → 0 uniformemente en ℝ, pero f'ₖ(0) = √k → +∞ no converge a f'(0) = 0",
            "fₖ solo converge puntualmente pero no uniformemente",
            "Como fₖ son C^∞ y convergen uniformemente, se puede derivar término a término"
        ],
        correct: 1,
        explanation: "La convergencia uniforme de fₖ NO basta para intercambiar límite y derivada: hace falta la convergencia uniforme de la sucesión de las derivadas {f'ₖ}."
    },
    {
        subject: "Análisis • Teorema de Ascoli-Arzelà",
        prompt: "Si {fₖ} es una sucesión en C([0,1]) tal que |fₖ(x)| ≤ 100 y |f'ₖ(x)| ≤ 100 para todo x ∈ [0,1] y todo k ∈ ℕ, ¿por qué podemos asegurar que tiene una subsucesión uniformemente convergente?",
        options: [
            "Porque toda bola cerrada de C([0,1]) es compacta por Heine-Borel",
            "Porque la cota uniforme de las derivadas implica, por el Teorema del Valor Medio, que la familia es equicontinua (Lipschitz con constante 100)",
            "Porque converge puntualmente a una función constante",
            "Por el Criterio M de Weierstrass"
        ],
        correct: 1,
        explanation: "Por el TVM, |fₖ(x) - fₖ(y)| ≤ 100|x - y|, lo que garantiza equicontinuidad. Junto a la acotación puntual y la compacidad de [0,1], el Teorema de Ascoli-Arzelà concluye el resultado."
    },
    {
        subject: "Análisis • Polinomios de Bernstein",
        prompt: "En la demostración constructiva del Teorema de Aproximación de Weierstrass mediante polinomios de Bernstein en [0,1], ¿cuánto vale exactamente la suma ∑_{k=0}^n (k - nx)² binom(n,k) xᵏ (1-x)ⁿ⁻ᵏ?",
        options: [
            "1",
            "nx",
            "nx(1 - x)",
            "n²x²(1 - x)²"
        ],
        correct: 2,
        explanation: "Representa la varianza de una distribución Binomial B(n, x), cuyo valor exacto es nx(1-x) ≤ n/4, lo que permite acotar la suma sobre los índices lejanos |k/n - x| > δ."
    },
    {
        subject: "Análisis • Funciones Analíticas",
        prompt: "Sea f(x) = e^(-1/x²) para x ≠ 0 y f(0) = 0. ¿Cuál de las siguientes afirmaciones sobre f en ℝ es verdadera?",
        options: [
            "No es derivable en x = 0",
            "Es de clase C^∞(ℝ) y analítica en todo ℝ",
            "Es de clase C^∞(ℝ), pero NO es analítica en x = 0 porque su serie de Taylor en 0 es idénticamente nula",
            "Su serie de Taylor en x = 0 tiene radio de convergencia R = 0"
        ],
        correct: 2,
        explanation: "Todas sus derivadas en el origen valen f^(k)(0) = 0. Su serie de Taylor en 0 converge a la función nula, que no coincide con f(x) > 0 en ningún entorno perforado de 0."
    },
    {
        subject: "Análisis • Series de Potencias y EDOs",
        prompt: "Al resolver la ecuación diferencial y'' + xy = 1 mediante series de potencias y(x) = ∑ aₙxⁿ centrada en x₀ = 0, ¿qué relación de recurrencia cumplen los coeficientes para n ≥ 1?",
        options: [
            "a₂ = 1/2 y a_{n+2} = -a_{n-1} / [(n+2)(n+1)]",
            "a₂ = 0 y a_{n+2} = -aₙ / (n+2)",
            "a₂ = 1 y a_{n+1} = a_{n-1} / (n+1)",
            "Tiene radio de convergencia finito R = 1"
        ],
        correct: 0,
        explanation: "Igualando potencias en 2a₂ + ∑ [(n+2)(n+1)a_{n+2} + a_{n-1}]xⁿ = 1 se obtiene a₂ = 1/2 y saltos de 3 en 3 con radio de convergencia R = +∞."
    },
    {
        subject: "Análisis • Sistemas Ortonormales",
        prompt: "En un espacio con producto escalar (X, ⟨·,·⟩) y un sistema ortonormal {φₖ}, ¿qué afirma la Identidad de Plancherel (o Parseval)?",
        options: [
            "Que ∑ |⟨u, φₖ⟩| ≤ ||u|| para todo u ∈ X",
            "Que el sistema es completo (base hilbertiana) si y solo si ||u||² = ∑_{k=1}^∞ |⟨u, φₖ⟩|² para todo u ∈ X",
            "Que toda serie ortonormal converge uniformemente",
            "Que ⟨u, φₖ⟩ = 0 para todo k suficientemente grande"
        ],
        correct: 1,
        explanation: "Por la identidad de Bessel ||u - ∑_{k=1}^N û(k)φₖ||² = ||u||² - ∑_{k=1}^N |û(k)|², la convergencia en norma a u equivale exactamente a que la suma de cuadrados de los coeficientes iguale a ||u||²."
    },
    {
        subject: "Análisis • Series de Fourier",
        prompt: "Respecto al espacio C_s(𝕋) de funciones 2π-periódicas continuas a trozos dotado de la norma cuadrática ||f||₂ = (∫₀²π |f(x)|² dx)^(1/2), ¿cuál de estas afirmaciones es cierta?",
        options: [
            "Es un espacio de Banach completo",
            "La convergencia en norma L² de la serie de Fourier implica siempre la convergencia puntual en todo punto",
            "No es un espacio métrico completo, y existen funciones continuas en C(𝕋) cuya serie de Fourier diverge en un punto",
            "El sistema trigonométrico no es completo en C_s(𝕋)"
        ],
        correct: 2,
        explanation: "(C_s(𝕋), ||·||₂) no es completo (su completación es L²(𝕋)), y como demostró du Bois-Reymond, la continuidad por sí sola no garantiza la convergencia puntual de la serie de Fourier."
    },
    {
        subject: "Análisis • Teorema de Dirichlet",
        prompt: "Sea f ∈ C_s(𝕋) tal que f' ∈ C_s(𝕋), definida en (0, 2π) por f(x) = x. ¿A qué valor converge puntualmente su serie de Fourier en x = 0 (y en x = 2π)?",
        options: [
            "A 0",
            "A 2π",
            "A π (la semisuma de los límites laterales [f(0⁺) + f(0⁻)] / 2)",
            "Diverge porque f es discontinua en 0"
        ],
        correct: 2,
        explanation: "Por el Teorema de Dirichlet, en una discontinuidad de salto la serie de Fourier converge al punto medio del salto: (0 + 2π)/2 = π."
    },
    {
        subject: "Análisis • Series de Fourier y Regularidad",
        prompt: "En la demostración de que toda función f ∈ C¹(𝕋) tiene una serie de Fourier que converge uniforme y absolutamente a f en ℝ, ¿qué identidad clave permite aplicar la desigualdad de Bessel a f'?",
        options: [
            "Integrando por partes se obtiene aₙ = -b'ₙ / n y bₙ = a'ₙ / n, y luego se acota (1/n)|b'ₙ| ≤ (1/2)(1/n² + |b'ₙ|²)",
            "Que los coeficientes aₙ son todos nulos para n > 1",
            "El Teorema de Ascoli-Arzelà aplicado a las sumas parciales",
            "Que |aₙ| ≤ 1/n para toda función integrable"
        ],
        correct: 0,
        explanation: "Al ser f continua y 2π-periódica (f(0)=f(2π)), la integración por partes relaciona los coeficientes de f con los de f' divididos por n. Combinando Young (uv ≤ (u²+v²)/2) y Bessel para f' se logra aplicar el Criterio M de Weierstrass."
    },

    // ================= ÁLGEBRA I: TEORÍA DE GRUPOS (12 PREGUNTAS) =================
    {
        subject: "Álgebra I • Criterio de Subgrupo",
        prompt: "Sea G un grupo y H ⊆ G un subconjunto NO vacío. ¿Bajo qué condición adicional basta comprobar únicamente que H es cerrado para el producto (∀ h₁, h₂ ∈ H, h₁h₂ ∈ H) para asegurar que H ≤ G?",
        options: [
            "Cuando G es un grupo abeliano (por ejemplo, ℕ en ℤ)",
            "Cuando H es un conjunto FINITO",
            "Cuando G es infinito",
            "Siempre basta comprobar que es cerrado para el producto"
        ],
        correct: 1,
        explanation: "Si H es finito y cerrado para el producto, para cada h ∈ H la aplicación x ↦ hx es inyectiva y por tanto biyectiva en H, garantizando el neutro y los inversos (en cambio, ℕ ⊂ ℤ es cerrado para la suma pero no es subgrupo)."
    },
    {
        subject: "Álgebra I • Órdenes de Elementos",
        prompt: "Si g ∈ G es un elemento de orden finito o(g) = n y m ∈ ℕ, ¿cuál es exactamente el orden de la potencia gᵐ?",
        options: [
            "n / m",
            "n / mcd(n, m)",
            "mcd(n, m)",
            "n · m"
        ],
        correct: 1,
        explanation: "Por el Lema 3 del Tema 1 de Álgebra, o(gᵐ) = n / gcd(n, m). Por ejemplo, en ℤ/6ℤ el elemento 1̄ tiene orden 6 y 2̄ tiene orden 6/gcd(6,2) = 3."
    },
    {
        subject: "Álgebra I • Grupos Cíclicos",
        prompt: "Si G = ⟨x⟩ es un grupo cíclico finito de orden n, ¿cuántos subgrupos tiene G de cada orden posible?",
        options: [
            "Tiene subgrupos de cualquier tamaño k ≤ n",
            "Para cada divisor positivo d de n, existe EXACTAMENTE UN único subgrupo de orden d, que es ⟨x^(n/d)⟩",
            "Tiene tantos subgrupos de orden d como elementos de orden d",
            "Solo tiene los subgrupos triviales {1} y G"
        ],
        correct: 1,
        explanation: "Todo subgrupo de un cíclico es cíclico y, si |G| = n, existe una biyección entre los divisores d | n y los subgrupos de G dada por d ↦ ⟨x^(n/d)⟩."
    },
    {
        subject: "Álgebra I • Grupo Simétrico y Lagrange",
        prompt: "En el grupo simétrico S₃ (|S₃| = 6), consideremos las transposiciones τ₁ = (1 2) y τ₂ = (1 3). ¿Qué subgrupo genera el conjunto { (1 2), (1 3) }?",
        options: [
            "Un subgrupo de orden 3",

        explanation: "Al no ser A un intervalo, existen x < z < y con x, y ∈ A y z ∉ A. La función f(t) = (t - z)/|t - z| es continua en todo A (pues t ≠ z) y su imagen es exactamente {-1, 1} (A es disconexo)."
    },
    {
        subject: "Cálculo y Análisis • Sucesiones de Cauchy en ℚ",
        prompt: "La sucesión recursiva x₁ = 2, x_{n+1} = (1/2)(xₙ + 2/xₙ) está formada exclusivamente por números racionales. ¿Qué propiedad fundamental ilustra en el espacio métrico (ℚ, |·|)?",
        options: [
            "Que (ℚ, |·|) es un espacio métrico completo",
            "Que {xₙ} es una sucesión de Cauchy en ℚ que NO converge en ℚ (pues su límite en ℝ es √2 ∉ ℚ), probando que ℚ no es completo",
            "Que existen sucesiones monótonas acotadas en ℝ que no son de Cauchy",
            "Que no está acotada inferiormente"
        ],
        correct: 1,
        explanation: "La propiedad de ser de Cauchy es intrínseca a los términos de la sucesión, pero la convergencia depende de que el punto límite pertenezca al espacio considerado."

    {
        subject: "Cálculo y Lógica • Indeterminaciones y Décimo Problema de Hilbert",
        prompt: "Según el Teorema de Davis-Putnam-Robinson-Matiyasevich aplicado a sucesiones reales, ¿por qué existen límites de cocientes aₙ/bₙ (con aₙ → 0 y bₙ → 0) cuyo valor es algorítmicamente indecidible?",
        options: [
            "Porque el límite puede no ser único en ℝ",
            "Porque no existe ningún algoritmo general capaz de decidir si un polinomio diofántico arbitrario P(x₁,...,xₖ) = 0 tiene soluciones enteras",
            "Porque la función sinc_π(t) no es continua",
            "Porque las sucesiones monótonas acotadas no siempre convergen"
        ],
        correct: 1,
        explanation: "Construyendo uₙ ∈ {0, 1} mediante productos de 1 - sinc_π(P(m₁,...,mₖ))² en cajas [-n, n]ᵏ, la sucesión es creciente y acotada (converge a 1 si P=0 tiene solución entera y a 0 si no), pero el Décimo Problema de Hilbert demuestra que no hay algoritmo general para decidirlo."
    },
    {

        prompt: "Si {aₙ} es una sucesión decreciente de términos positivos (aₙ > 0), ¿con qué serie numérica compara el Criterio de Condensación de Cauchy la serie ∑_{n=1}^∞ aₙ?",
        options: [
            "Con ∑_{n=1}^∞ n · aₙ",
            "Con ∑_{k=0}^∞ 2ᵏ a_{2ᵏ}",
            "Con ∑_{n=1}^∞ (aₙ)²",
            "Con ∑_{k=1}^∞ a_{k²}"
        ],
        correct: 1,
        explanation: "Agrupando en bloques de longitud 2ᵏ se cumple A_{2ⁿ-1} ≤ ∑_{k=0}^{n-1} 2ᵏ a_{2ᵏ} ≤ 2 A_{2ⁿ⁻¹}, por lo que ∑ aₙ converge si y solo si converge la serie condensada ∑ 2ᵏ a_{2ᵏ}."

let currentQ = {};
let answered = false;
let isDoubleOrNothing = false;
let countdownInterval = null;

// Comprobar al abrir si el usuario está castigado (bloqueo temporal activo)
function checkLockoutStatus() {
    const lockoutUntil = parseInt(localStorage.getItem('studygate_lockout_until') || '0', 10);
    const now = Date.now();
    
    if (lockoutUntil > now) {
        showLockoutScreen(lockoutUntil);
        return true;
    } else {
        localStorage.removeItem('studygate_lockout_until');
        document.getElementById('lockoutCard').style.display = 'none';
        document.getElementById('quizCard').style.display = 'block';
        return false;
    }
}

function triggerLockout(minutes, message) {
    const lockoutUntil = Date.now() + (minutes * 60 * 1000);
    localStorage.setItem('studygate_lockout_until', lockoutUntil.toString());
    localStorage.setItem('studygate_lockout_msg', message);
    showLockoutScreen(lockoutUntil);
}

function showLockoutScreen(lockoutUntil) {
    document.getElementById('quizCard').style.display = 'none';
    const lockoutCard = document.getElementById('lockoutCard');
    lockoutCard.style.display = 'block';
    
    const savedMsg = localStorage.getItem('studygate_lockout_msg');
    if (savedMsg) {
        document.getElementById('lockoutReason').textContent = savedMsg;
    }
    
    const badge = document.getElementById('badge');
    badge.innerHTML = "⛔ Penalización Activa";
    badge.style.background = "rgba(255, 69, 58, 0.25)";
    badge.style.color = "#ff453a";

    if (countdownInterval) clearInterval(countdownInterval);
    
    function updateTimer() {
        const remainingMs = lockoutUntil - Date.now();
        if (remainingMs <= 0) {
            clearInterval(countdownInterval);
            localStorage.removeItem('studygate_lockout_until');
            localStorage.removeItem('studygate_lockout_msg');
            isDoubleOrNothing = false;
            checkLockoutStatus();
            loadQuestion();
            return;
        }
        const totalSecs = Math.ceil(remainingMs / 1000);
        const mins = Math.floor(totalSecs / 60);
        const secs = totalSecs % 60;
        document.getElementById('timerDisplay').textContent = 
            String(mins).padStart(2, '0') + ":" + String(secs).padStart(2, '0');
    }
    
    updateTimer();
    countdownInterval = setInterval(updateTimer, 1000);
}

function loadQuestion() {
    if (checkLockoutStatus()) return;
    
    answered = false;
    document.getElementById('explanation').style.display = 'none';
    const actionArea = document.getElementById('actionArea');
    actionArea.style.display = 'none';
    actionArea.innerHTML = '';
    
    const badge = document.getElementById('badge');
    const subtitle = document.getElementById('subtitle');
    
    if (isDoubleOrNothing) {
        badge.innerHTML = "🎲 MODO DOBLE O NADA";
        badge.style.background = "rgba(255, 159, 10, 0.2)";
        badge.style.color = "#ff9f0a";
        subtitle.textContent = "Acierta = 30 min libres • Falla = 30 min bloqueado";
    } else {
        badge.innerHTML = "🔒 Entretenimiento Bloqueado";
        badge.style.background = "rgba(255, 69, 58, 0.15)";
        badge.style.color = "#ff453a";
        subtitle.textContent = "1 fallo = 15 min bloqueado o Doble o Nada";
    }
    
    // Evitar que salga exactamente la misma pregunta seguida en el Doble o Nada
    let nextQ;
    do {
        nextQ = questions[Math.floor(Math.random() * questions.length)];
    } while (questions.length > 1 && nextQ.prompt === currentQ.prompt);
    
    currentQ = nextQ;
    document.getElementById('subject').textContent = currentQ.subject;
    document.getElementById('prompt').textContent = currentQ.prompt;
    
    const optionsEl = document.getElementById('options');
    optionsEl.innerHTML = '';
    
    currentQ.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => selectOption(idx, btn);
        optionsEl.appendChild(btn);
    });
}

function selectOption(idx, btn) {
    if (answered) return;
    answered = true;
    
    const buttons = document.querySelectorAll('.option-btn');
    const exp = document.getElementById('explanation');
    const actionArea = document.getElementById('actionArea');
    const badge = document.getElementById('badge');
    
    if (idx === currentQ.correct) {
        // RESPUESTA CORRECTA
        btn.classList.add('correct');
        exp.textContent = "✅ " + currentQ.explanation;
        exp.style.display = 'block';
        
        const rewardMinutes = isDoubleOrNothing ? 30 : 15;
        badge.innerHTML = isDoubleOrNothing ? "🏆 ¡Doble o Nada Ganado!" : "🔓 Reto Superado";
        badge.style.background = "rgba(48, 209, 88, 0.18)";
        badge.style.color = "#30d158";
        
        // Pasa el tiempo como parámetro 'input' al Atajo ConcederPase
        const unlockLink = document.createElement('a');
        unlockLink.className = 'btn btn-success';
        unlockLink.href = `shortcuts://run-shortcut?name=ConcederPase&input=text&text=${rewardMinutes}`;
        unlockLink.textContent = `🔓 Activar ${rewardMinutes} min de acceso`;
        
        actionArea.appendChild(unlockLink);
        actionArea.style.display = 'flex';
        isDoubleOrNothing = false;
        
    } else {
        // RESPUESTA INCORRECTA
        btn.classList.add('wrong');
        buttons[currentQ.correct].classList.add('correct');
        exp.textContent = "❌ " + currentQ.explanation;
        exp.style.display = 'block';
        
        if (!isDoubleOrNothing) {
            // Primer fallo: ofrecer aceptar 15 min de bloqueo o jugar Doble o Nada
            badge.innerHTML = "⚠️ Has fallado la pregunta";
            
            const doubleBtn = document.createElement('button');
            doubleBtn.className = 'btn btn-double';
            doubleBtn.textContent = "🎲 Jugar DOBLE O NADA (30m premio / 30m castigo)";
            doubleBtn.onclick = () => {
                isDoubleOrNothing = true;
                loadQuestion();
            };
            
            const surrenderBtn = document.createElement('button');
            surrenderBtn.className = 'btn btn-surrender';
            surrenderBtn.textContent = "⏳ Aceptar bloqueo de 15 minutos";
            surrenderBtn.onclick = () => {
                triggerLockout(15, "Has fallado la pregunta inicial y has aceptado la penalización de 15 minutos sin entretenimiento.");
            };
            
            actionArea.appendChild(doubleBtn);
            actionArea.appendChild(surrenderBtn);
            actionArea.style.display = 'flex';
        } else {
            // Falló el Doble o Nada -> Bloqueo directo de 30 minutos tras leer la explicación 3.5s
            badge.innerHTML = "💀 Doble o Nada Perdido (30 min)";
            const msgBtn = document.createElement('button');
            msgBtn.className = 'btn btn-surrender';
            msgBtn.textContent = "Bloqueando durante 30 minutos en 4s...";
            actionArea.appendChild(msgBtn);
            actionArea.style.display = 'flex';
            
            setTimeout(() => {
                isDoubleOrNothing = false;
                triggerLockout(30, "Has perdido el Doble o Nada. StudyGate permanecerá bloqueado durante 30 minutos completos.");
            }, 4000);
        }
    }
}

loadQuestion();
</script>
